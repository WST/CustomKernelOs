<!doctype html><title>CSS effects</title><style>
body{font:16px sans-serif;background:#f3f5f8;margin:24px;color:#203048}
h1{font-size:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.card{padding:20px;background:white;border-radius:14px;box-shadow:0 5px 16px #20304830}
.icon{width:64px;height:64px;background:#1688cc;mask:url(css-assets/mask.svg) center/contain no-repeat}
.fade{opacity:.5;background:#ff8b20;padding:16px}.fade b{display:block;background:#2684ff;color:white;padding:12px}
.inset{box-shadow:inset 0 2px 10px #20304850}code{font-family:monospace}.spacer{height:700px}
</style><h1>CSS masks, shadows and fonts</h1><div class=grid>
<div class=card><div class=icon></div><h2>SVG mask</h2><p>The color follows the silhouette.</p></div>
<div class=card><h2>Group opacity</h2><div class=fade>Half opacity<b>Overlapping child</b></div></div>
<div class="card inset"><h2>Inset shadow</h2><code>const aligned = 42;</code><p>Normal text uses the UI font.</p></div>
</div><div class=spacer></div><div class=card>Scroll back to check clipped shadows and masks.</div>
