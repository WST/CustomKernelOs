<!DOCTYPE html>
<html class="no-js"><head><title>JS test</title>
<style>.hidden { display: none } #later { color: red } @media (max-width: 500px) { .wide { display:none } } @media print { .scr { display:none } }</style>
<script>document.documentElement.className = 'js';</script>
<script src="lib.js"></script>
</head>
<body onload="console.log('body onload')">
<noscript><p>Please enable JavaScript</p></noscript>
<div id="app">Loading...</div>
<p class="hidden">hidden by css</p><p class="wide">wide shown</p><p class="scr">screen shown</p>
<script>
  document.write('<p id="w">written <b>bold</b></p>');
  var app = document.getElementById('app');
  app.innerHTML = '<ul>' + [1,2,3].map(function(i){ return '<li>item ' + i + '</li>'; }).join('') + '</ul>';
  console.log('lib says', libValue, document.querySelectorAll('li').length, document.title);
  document.addEventListener('DOMContentLoaded', function(){ console.log('DOMContentLoaded', document.readyState); });
  window.addEventListener('load', function(){ console.log('window load'); });
</script>
<button id="btn" onclick="this.textContent = 'clicked ' + (++window.n || (window.n = 1)); return false">Click me</button>
<a id="lnk" href="/next">next</a>
<span id="cnt">0</span>
<input id="q" name="q" value="">
<script>
  document.getElementById('lnk').addEventListener('click', function(e){ e.preventDefault(); console.log('link click prevented'); });
  var c = 0; var t = setInterval(function(){ document.getElementById('cnt').textContent = ++c; if (c == 3) clearInterval(t); }, 20);
  document.getElementById('q').addEventListener('input', function(e){ console.log('input value', e.target.value); });
  var el = document.createElement('div'); el.id = 'later'; el.className = 'a b'; el.classList.add('c'); el.classList.remove('a');
  el.style.color = 'red'; el.dataset.fooBar = 'x'; el.appendChild(document.createTextNode('dynamic'));
  document.body.appendChild(el);
  console.log(el.outerHTML, el.matches('.b.c'), el.closest('body').tagName);
  fetch('data.json').then(function(r){ return r.json(); }).then(function(d){ console.log('fetched', d.x); });
  var x = new XMLHttpRequest(); x.open('GET', 'data.json'); x.onload = function(){ console.log('xhr', x.status, x.responseText.length); }; x.send();
  console.log(location.href, location.pathname, new URL('../a?b=1#c', location.href).href, navigator.userAgent.indexOf('MyOS') > 0);
  document.cookie = 'a=1'; document.cookie = 'b=2; path=/'; console.log('cookie', document.cookie);
  localStorage.setItem('k', 'v'); console.log('ls', localStorage.getItem('k'), localStorage.length);
</script>
</body></html>
